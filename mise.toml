# mise config for uxid-dotnet: the toolchain and the gate tasks.
#
#   mise install          provision the toolchain below
#   mise run gate:loop    inner loop: build, test
#   mise run gate         full gate, the advancement gate
#
# The .NET SDK is pinned here and again in global.json, so `dotnet` resolves
# the same SDK with or without mise. The library targets netstandard2.0 and
# net10.0; the tests run on net10.0 here, and on net481 as well on Windows.
# The conformance corpus check is part of the full gate: gate:corpus runs the
# hash and case-count checks and every vendored case (conformance/).

[tools]
dotnet = "10.0.402"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks."gate:sdk"]
description = "Print the SDK the gate runs on; fail unless it is a 10.x SDK"
run = '''
set -eu
version=$(dotnet --version)
echo "dotnet SDK $version at $(command -v dotnet)"
case "$version" in
  10.*) ;;
  *) echo "expected a 10.x SDK (global.json and mise.toml pin 10.0)" >&2; exit 1 ;;
esac
'''

[tasks."gate:format"]
description = "Fail when dotnet format would change any file"
run = "dotnet format Riddler.Uxid.slnx --verify-no-changes"

[tasks."gate:build"]
description = "Build every project in Release, analyzers on, warnings as errors"
run = "dotnet build Riddler.Uxid.slnx --configuration Release"

[tasks."gate:test"]
description = "Run the tests on the Release build"
run = "dotnet test --solution Riddler.Uxid.slnx --configuration Release --no-build"

[tasks."gate:coverage"]
description = "Run the net10.0 tests with coverlet, failing under 90 percent of the library's lines"
# The threshold applies once the library has a source file. With none there is
# nothing to measure, and coverlet fails any threshold on an assembly with no
# lines, so the tests still run and the report says so. Coverage runs on
# net10.0, the one target coverlet.MTP is referenced on; gate:test runs every
# target the test project has on the platform.
run = '''
set -eu
rm -rf artifacts/coverage
set -- --coverlet --coverlet-include "[Riddler.Uxid]*" --coverlet-output-format cobertura --results-directory artifacts/coverage
if [ -n "$(find src/Riddler.Uxid -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*')" ]; then
  set -- "$@" --coverlet-threshold 90 --coverlet-threshold-type line --coverlet-threshold-stat total
else
  echo "src/Riddler.Uxid holds no source file yet: coverage is collected with no threshold"
fi
status=0
dotnet test --solution Riddler.Uxid.slnx --configuration Release --framework net10.0 --no-build "$@" || status=$?
for report in artifacts/coverage/coverage.cobertura.*.xml; do
  [ -f "$report" ] || continue
  sed -n 's/^<coverage line-rate="\([^"]*\)".* lines-covered="\([^"]*\)" lines-valid="\([^"]*\)".*/library lines covered: \2 of \3 (line rate \1)/p' "$report"
done
exit "$status"
'''

[tasks."gate:corpus"]
description = "Check the vendored conformance corpus: its hash and case counts, then every case"
run = '''
set -eu
dotnet test --solution Riddler.Uxid.slnx --configuration Release --framework net10.0 --no-build --filter-class Riddler.Tests.CorpusHashTests --filter-class Riddler.Tests.CorpusTests
'''

[tasks."gate:pack"]
description = "Pack the library with package validation"
run = '''
set -eu
rm -rf artifacts/package
dotnet pack src/Riddler.Uxid/Riddler.Uxid.csproj --configuration Release --no-build --output artifacts/package
'''

[tasks."gate:loop"]
description = "Inner loop: build, test"
run = [
  { task = "gate:build" },
  { task = "gate:test" },
]

[tasks.gate]
description = "Full gate"
run = [
  { task = "gate:sdk" },
  { task = "gate:format" },
  { task = "gate:build" },
  { task = "gate:coverage" },
  { task = "gate:corpus" },
  { task = "gate:pack" },
]
